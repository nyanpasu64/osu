no-hidpi-window-scale
keep-open=yes
volume-max=200
screenshot-directory="/home/nyanpasu64/Pictures/"

script-opts-append=ytdl_hook-try_ytdl_first=yes
script-opts-append=ytdl_hook-exclude="%.webm$|%.ts$|%.mp3$|%.m3u8$|%.m3u$|%.mkv$|%.mp4$|%.VOB$"
save-position-on-quit

sub-auto=fuzzy
ytdl-raw-options=ignore-config=,sub-format=en,sub-lang="en",write-sub=,write-auto-sub=
