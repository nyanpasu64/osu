<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/usr/share/xml/fontconfig/fonts.dtd">
<fontconfig>

  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Source Serif 4</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>IBM Plex Mono</string>
    </edit>
  </match>

  <!--
    better to use ibm plex mono, than nimbus mono which is spindly and ff is 1 character wide

    docs at https://www.freedesktop.org/software/fontconfig/fontconfig-user.html
  -->
  <match target="pattern">
    <test name="family">
      <string>Courier</string>
    </test>
    <test name="family">
      <string>Courier New</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>IBM Plex Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>

  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>
